<!DOCTYPE html>
<html>
<head>
<title>BMW</title>
<style>
body{font-family:Arial;text-align:center;background:#f0f0f0}
.box{background:white;padding:20px;margin:20px auto;width:320px;border-radius:10px}
img{width:100%;height:120px;object-fit:cover;border-radius:5px}
button{padding:10px 20px;background:#1e3c72;color:white;border:none;border-radius:5px;cursor:pointer}
</style>
</head>

<body>

<h1>BMW</h1>

<div id="welcome" class="box">
<p>Welcome to BMW. Your dream car is waiting!</p>
<button onclick="showCars()">See Cars</button>
</div>

<div id="cars" class="box" style="display:none">
<div>
<img src="BMW.jpg">
<h3>BMW M3 - ₹1.47 crore</h3>
<p>503 HP Turbo. Track ready.</p>
</div>

<div>
<img src="BMW1.jpg">
<h3>BMW X5 - ₹1.25 crore</h3>
<p>335 HP SUV. Luxury AWD.</p>
</div>

<button onclick="showCars()">Back</button>
</div>

<script>
function showCars(){
let w=document.getElementById("welcome");
let c=document.getElementById("cars");

if(c.style.display=="none"){
c.style.display="block";
w.style.display="none";
}else{
c.style.display="none";
w.style.display="block";
}
}
</script>

</body>
</html>
